name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # **Which of the three expensive jobs need to run at all.**
  #
  # The three macOS jobs take twelve to fourteen minutes between them and most pushes to this
  # repository touch only documentation. Fourteen minutes proving that a markdown edit did not
  # break a Keychain test is time nobody gets back, and a slow pipeline is one people learn to
  # ignore.
  #
  # **An allow list, never a deny list.** The safe paths are named, and anything not on the list
  # runs everything. A deny list is wrong the first day somebody edits a script, a plist or a
  # workflow and it is quietly treated as prose. If a path is unrecognised, the full suite runs:
  # the failure mode is a wasted quarter of an hour rather than an untested change.
  #
  # **Style always runs**, on every push, because the em dash and trailing whitespace checks are
  # exactly what documentation needs and it finishes in ten seconds.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether anything outside the documentation changed
        id: decide
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # A first push, a force push, or a missing base: run everything rather than guess.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit. Running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # **The allow list.** Prose and images only. Everything else, including scripts, the
          # workflow itself, entitlements and project files, counts as code.
          UNSAFE=$(printf '%s\n' "$CHANGED" | grep -vE '^(docs/.*\.md|assets/.*|site/.*|[A-Z_]+\.md)$' || true)

          if [ -z "$UNSAFE" ]; then
            echo "Documentation only. Skipping the macOS jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "Outside the documentation:"; printf '%s\n' "$UNSAFE" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project style forbids em dashes everywhere, including code, comments,
      # documentation, and commit messages. The character is written here as an escape
      # so that this file does not fail its own check.
      - name: No em dashes
        run: |
          DASH=$(printf '\xe2\x80\x94')
          # **docs/audits is excluded, and the reason is not laziness.** That directory reproduces
          # what three external reviewers actually wrote, verbatim, and they write em dashes. A
          # house style rule cannot govern text this project did not write, and editing a quoted
          # return to satisfy one would make the word "verbatim" false. The rule still governs
          # every line this project writes, which is everywhere else.
          if git grep -n -I -- "$DASH" -- ':!docs/audits'; then
            echo "Found an em dash. Use a comma, a colon, parentheses, or two sentences."
            exit 1
          fi
          echo "No em dashes found."

      # SECURITY.md tells people the app makes no network requests and that this is
      # verified rather than asserted. Until gate A2 nothing verified it. The claim is the
      # foundation of the whole "nothing is stored online" pitch, so it is checked on every
      # push rather than re-established by hand at each audit. Gate A2, F16.
      #
      # It sweeps every Swift file and excludes, rather than naming directories. The first
      # version named three, and the project grew three more in the same pull request that
      # wrote it: the shared folder and both watch targets went unchecked while SECURITY.md
      # said the whole tree was covered. A check that has to be updated whenever a folder
      # appears is a check that will be wrong. Gate A2, F19.
      - name: No network code, and no logging of anything
        run: |
          if git grep -n -I -E \
            'URLSession|NSURLConnection|import Network|CFSocket|Foundation\.URL\(string' \
            -- '*.swift' ':!OpenFactorUITests/*' \
            | grep -v 'URL(string: "https://github.com'; then
            echo "Found something that can reach the network. The app makes no requests."
            exit 1
          fi
          if git grep -n -I -E '\bprint\(|NSLog\(|os_log|Logger\(' \
            -- '*.swift' ':!OpenFactorUITests/*'; then
            echo "Found logging. A code or an account name must never reach a log."
            exit 1
          fi
          # A symbol check on the built binary cannot fail on these: the Swift runtime
          # references dlsym itself, so it is present in every binary this project produces
          # whatever we write. That makes source the only place the distinction can be drawn,
          # and it matters, because dynamic lookup is exactly how a symbol check gets evaded.
          # Neither belongs in this codebase, so their absence is part of the argument that
          # the binary check means something.
          if git grep -n -I -E 'dlsym|dlopen|NSClassFromString' \
            -- '*.swift' ':!OpenFactorUITests/*'; then
            echo "Found dynamic symbol lookup. It has no use here, and it is how the"
            echo "binary-level network check would be evaded. See the 'No network' job."
            exit 1
          fi
          echo "No network code and no logging found."

      # App Lock keeps one lock window and one cover window, attached to the first connected
      # scene. That is correct for one scene and wrong for two: gate A4 found the app shipping
      # with multiple scenes enabled, so a second iPad window had no cover in the app switcher
      # and no lock over it, contradicting SECURITY.md and docs/APP_LOCK.md.
      #
      # The assumption lives in PrivacyShield and the guarantee lives in an Info.plist, which is
      # exactly the distance at which somebody re-enables multiple windows for a good reason and
      # never learns what it broke. Xcode also generates this key as true by default for a SwiftUI
      # app, so the safe value is the one that needs defending.
      - name: One window scene, which App Lock depends on
        run: |
          set -e
          # **Read with python3, not plutil, because this job runs on Linux.** The first version
          # used `plutil`, which is macOS only, and folded its own "command not found" into
          # `|| echo missing`. On the runner it therefore reported the setting as absent when
          # what had happened was that it could not read the file at all. It passed on the
          # author's machine every time and failed the first time it ran here, for a reason that
          # had nothing to do with the project.
          #
          # **A check that cannot tell "this is wrong" from "I cannot look" is not a check.**
          # Those two now produce different words and different messages.
          READER='import plistlib;d=plistlib.load(open("OpenFactor-Info.plist","rb"));s=d.get("UIApplicationSceneManifest") or {};print(str(s.get("UIApplicationSupportsMultipleScenes","ABSENT")).lower())'
          VALUE=$(python3 -c "$READER" 2>/dev/null || echo "unreadable")
          echo "UIApplicationSupportsMultipleScenes: $VALUE"
          if [ "$VALUE" = "unreadable" ]; then
            echo "OpenFactor-Info.plist could not be parsed, so this step proved nothing."
            echo "Fix the reader or the file. This is not a passing build."
            exit 1
          fi
          if [ "$VALUE" != "false" ]; then
            echo "App Lock and the snapshot cover are single-scene. See PrivacyShield's"
            echo "foregroundScene and the comment in OpenFactor-Info.plist. To support multiple"
            echo "windows, make the lock and cover per scene first, then change this."
            exit 1
          fi
          # **Generation must be switched off explicitly, not merely not switched on.** Round
          # two of the gate pointed out that this check only failed on the literal YES, so
          # deleting the lines entirely would restore Xcode's SwiftUI default, generate a manifest
          # that overrides the file above, and leave this green. Requiring the lines to be present
          # and NO closes that: silence is now a failure.
          for SDK in iphoneos iphonesimulator; do
            COUNT=$(grep -c "\"INFOPLIST_KEY_UIApplicationSceneManifest_Generation\[sdk=$SDK\*\]\" = NO" \
              OpenFactor.xcodeproj/project.pbxproj || true)
            if [ "$COUNT" -lt 2 ]; then
              echo "The scene manifest generation switch for $SDK is missing from a build"
              echo "configuration, or is not NO. Found $COUNT of the expected 2."
              echo "Xcode would generate a manifest that overrides OpenFactor-Info.plist, which is"
              echo "how the multiple-scene defect shipped in the first place."
              exit 1
            fi
          done

          if grep -q "INFOPLIST_KEY_UIApplicationSceneManifest_Generation\[sdk=iphoneos\*\]\" = YES" \
            OpenFactor.xcodeproj/project.pbxproj; then
            echo "Xcode is generating the scene manifest again, which would override the file."
            exit 1
          fi

          echo "ok: one scene, and the file is authoritative"

      # This repository is public and its maintainer's circumstances are not part of it.
      # A statement about what the project can or cannot pay for is private information that
      # reaches everybody who ever clones this, and it is worth nothing to a reader: what a
      # document should say is what was done, not what could not be.
      #
      # Added after "there is no budget for a commissioned review" was written into the
      # roadmap, the handoff, and a commit message, explaining why a security gate was met the
      # way it was. Nothing had been pushed, which was luck rather than a process.
      #
      # This catches crude phrasings only. It cannot catch the same fact said carefully, so it
      # is a backstop under a judgment call rather than a replacement for one. The patterns are
      # anchored to phrases rather than to words, so the character and byte budgets discussed
      # elsewhere in these documents do not match, and this file excludes itself since it
      # necessarily contains them.
      #
      # `git grep -E` does not support `\b`, which the credentials check above records the hard
      # way, so nothing here relies on it.
      - name: No private circumstances in public documents
        run: |
          if git grep -n -I -E \
            "no budget|(cannot|can not|could not|can'?t|could'?nt) afford|out of (my|our) pocket|too expensive|(do not|don'?t) have the money|my (salary|income|savings|rent|mortgage)|personal finances" \
            -- '*.md' ':!.github/workflows/ci.yml'; then
            echo "Found something about the maintainer's circumstances rather than the project's."
            echo "This repository is public. Say what was done and what it does not claim;"
            echo "the reason a different option was not taken is nobody else's business."
            exit 1
          fi
          echo "No private circumstances found."

      # SECURITY.md's answer to the malicious-dependency attacker is that there are none. That
      # was the one claim in that section nothing enforced, sitting beside claims a machine
      # checks, and the supply chain is exactly where a promise in prose is worth least: a
      # dependency arrives by somebody adding one line, in a pull request about something else.
      #
      # Three ways one can appear, so three checks. The package can declare one, Xcode can
      # reference one in the project file, and a resolved file appearing at all means something
      # was fetched.
      - name: No third-party dependencies
        run: |
          set -e
          if git grep -n -E '\.package\(' -- 'Package.swift'; then
            echo "Package.swift declares a remote dependency."
            echo "SECURITY.md tells readers the supply chain is this repository, the Swift"
            echo "toolchain, and Apple's frameworks. Change that document first, deliberately."
            exit 1
          fi
          # Only the *remote* reference kind. XCSwiftPackageProductDependency is how the
          # project consumes the local OpenFactorCore package and is present by design; the
          # first version of this check matched it and failed on a clean tree.
          if git grep -n -E 'XCRemoteSwiftPackageReference' -- '*.pbxproj'; then
            echo "The Xcode project references a remote Swift package."
            exit 1
          fi
          if git ls-files | grep -iE '(^|/)Package\.resolved$'; then
            echo "A Package.resolved is tracked, so something was fetched."
            exit 1
          fi
          echo "No third-party dependencies."

      # Added after an App Store Connect API key identifier was committed to this public
      # repository and pushed. Nothing was compromised: an identifier is not the key, and
      # neither the key nor the issuer identifier was ever here. But a project whose premise
      # is being auditable and careful with secrets should not rely on somebody noticing.
      #
      # These match shapes rather than known values, so the check keeps working after a key
      # is rotated and catches a credential nobody has thought of yet.
      #
      # `git grep -E` does **not** support `\b`. The first version of this check used it,
      # matched nothing, and reported success against a file that contained the exact string
      # it was written to catch. Every pattern here was tested against a positive before
      # being trusted, which is the only reason this job is worth having.
      #
      # This file is excluded from its own patterns, since it necessarily contains them.
      - name: No credentials
        run: |
          fail() {
            echo "$1"
            echo "Credentials are read at run time, never committed. See scripts/ship-testflight.sh."
            exit 1
          }

          # An Apple API key identifier is ten upper case alphanumerics, too common a shape
          # to match alone, so it is anchored to the words that accompany one.
          if git grep -n -I -E \
            '(KEY_ID|KEYID|key_id|keyId|apiKey|api_key|API_KEY|ApiKey)[^A-Za-z0-9]{1,4}[A-Z0-9]{10}([^A-Za-z0-9]|$)' \
            -- ':!.github/workflows/ci.yml'; then
            fail "Found something shaped like an API key identifier."
          fi

          # An issuer identifier is a UUID, and none belongs here: the account's is read from
          # the home directory and test UUIDs are generated at run time.
          if git grep -n -I -E \
            '(issuer|ISSUER|apiIssuer|issuer_id)[^A-Za-z0-9]{1,4}[0-9a-f]{8}-[0-9a-f]{4}' \
            -- ':!.github/workflows/ci.yml'; then
            fail "Found something shaped like an issuer identifier."
          fi

          if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' \
            -- ':!.github/workflows/ci.yml'; then
            fail "Found a private key block."
          fi

          # Files that are credentials whatever is inside them.
          if git ls-files | grep -iE '\.(p8|p12|pem|cer|mobileprovision|keystore|jks)$'; then
            fail "Found a credential file tracked in the repository."
          fi

          echo "No credentials found."

      # RTF fixtures are excluded because in RTF a trailing space is not whitespace: it
      # is the delimiter that terminates a control word, so `\u8232 ` at the end of a line
      # carries meaning. The fixtures are captured exports and are kept byte exact.
      - name: No trailing whitespace
        run: |
          if git grep -n -I -- ' $' -- ':!*.rtf'; then
            echo "Found trailing whitespace."
            exit 1
          fi
          echo "No trailing whitespace found."

      # An Xcode project file is not readable in a diff, so the settings that matter are
      # asserted here instead. Changing one of these is a deliberate act that also has to
      # change this job and docs/PROJECT.md. See that file for what each one is for.
      - name: Project settings are what the documentation says
        run: |
          set -e
          check() {
            if ! grep -q "$1" OpenFactor.xcodeproj/project.pbxproj; then
              echo "Missing from the project file: $1"
              echo "If this change is intended, update this job and docs/PROJECT.md."
              exit 1
            fi
            echo "ok: $1"
          }
          check "PRODUCT_BUNDLE_IDENTIFIER = dev.openfactor.app;"
          # The watch app has to be EMBEDDED in the iOS app, not merely a sibling target
          # in the same project. It was a sibling for three pull requests, which is
          # invisible everywhere that matters: it builds, it installs from Xcode onto a
          # paired watch, and every test passes. The first thing that noticed was
          # TestFlight, which reported "Apple Watch: No" on a build that had already gone
          # to a tester. A phase in a file nobody reads is exactly what this job is for.
          check "Embed Watch Content"
          check "dstSubfolderSpec = 16;"
          check "IPHONEOS_DEPLOYMENT_TARGET = 18.0;"
          # **Xcode defaults this to YES and it was instrumenting Release builds.** It appears
          # nowhere in this project file until somebody writes it, so the default was shipping
          # coverage tables in every binary Apple distributes: 1.2 MB in the app alone, and the
          # only nondeterminism left in the artifact once the linker's UUID was accounted for.
          # Found while measuring what varies between two Release builds, not by reading settings.
          # Debug keeps coverage, so test coverage is unaffected.
          check "ENABLE_CODE_COVERAGE = NO;"
          check "TEST_HOST = "
          check "relativePath = .;"
          # A missing usage string is not a warning, it is a crash the first time the app
          # touches the camera, and only on a real device.
          check "INFOPLIST_KEY_NSCameraUsageDescription"
          # Same failure shape as the camera string: absent, the Face ID prompt is a
          # crash, not a warning, and only on a real device.
          check "INFOPLIST_KEY_NSFaceIDUsageDescription"
          # The watch app sees the phone's accounts only because both targets declare the
          # same access group. Get this wrong and the watch runs perfectly and shows
          # nothing, which is the hardest kind of bug to attribute.
          check "PRODUCT_BUNDLE_IDENTIFIER = dev.openfactor.app.watchkitapp;"
          check "INFOPLIST_KEY_WKCompanionAppBundleIdentifier = dev.openfactor.app;"
          check "OpenFactorWatch.entitlements"
          check "WATCHOS_DEPLOYMENT_TARGET = 11.0;"
          # The share extension has to be embedded too, and for the same reason the watch
          # app did: a sibling target builds, passes, and reaches nobody.
          check "PRODUCT_BUNDLE_IDENTIFIER = dev.openfactor.app.share;"
          check "Embed Foundation Extensions"
          check "dstSubfolderSpec = 13;"
          # Xcode's default here is "1,2,7", iPhone and iPad and Vision Pro, and it sat
          # in this file unnoticed against a README and a listing that both say iPhone
          # and Apple Watch. It is not tidiness: App Store Connect requires a screenshot
          # set per declared family, so the default demanded iPad and Vision Pro sets and
          # invited a reviewer to open the app on hardware the UI was never designed for.
          # The test targets still say "1,2,7" and are not checked, because they never
          # ship.
          if grep -n "TARGETED_DEVICE_FAMILY" OpenFactor.xcodeproj/project.pbxproj \
            | grep -v "TARGETED_DEVICE_FAMILY = 1;" \
            | grep -v "TARGETED_DEVICE_FAMILY = 4;" \
            | grep -v "1,2,7"; then
            echo "A shipping target declares a device family that is not iPhone or watch."
            echo "The app and the share extension are 1; the watch targets are 4."
            exit 1
          fi
          echo "ok: no unexpected device family"

      # The share extension's security claim is what it CANNOT do, and the absence of an
      # entitlement is the whole of it. An absence is invisible in review and costs one
      # line to reintroduce, so it is asserted here instead of promised in a comment.
      #
      # Structurally, not by grep. The first version of this check counted occurrences of
      # the string in the file and passed while lying, because the comment in that file
      # explains why the key is absent and therefore contains it.
      - name: The share extension cannot reach the Keychain
        run: |
          set -e
          # **plistlib rather than plutil, because this job runs on Linux**, and the same
          # mistake made this step fail on every run it has ever had. It was red on 18 August
          # for exactly this reason, and a step that has never once completed has never once
          # checked the thing it claims to enforce. See the scene manifest step above.
          READER='import plistlib;print(" ".join(sorted(plistlib.load(open("OpenFactorShare/OpenFactorShare.entitlements","rb")))))'
          keys=$(python3 -c "$READER" 2>/dev/null || echo "UNREADABLE")
          if [ "$keys" = "UNREADABLE" ]; then
            echo "The entitlements file could not be parsed, so this step proved nothing."
            exit 1
          fi
          echo "entitlement keys: $keys"
          if [ "$keys" != "com.apple.security.application-groups" ]; then
            echo "The share extension must declare the app group and nothing else."
            echo "It must never gain keychain-access-groups: it cannot be allowed to read"
            echo "an account or write one. See OpenFactorShare/ShareViewController.swift."
            exit 1
          fi
          echo "ok: one entitlement, and it is not the Keychain"

      # A required reason API used without a matching manifest entry is invisible: it
      # builds, it runs, it passes every test, and it surfaces as an automated notice from
      # Apple at upload, which is the worst moment to discover it. It is also a rot that
      # arrives by addition rather than by edit. The file timestamp entry was missing from
      # the day SharedInbox gained its freshness window, and nothing anywhere noticed.
      #
      # Only one direction is checked, used but not declared. A declared category that is
      # no longer used is untidy rather than a submission problem, and failing on it would
      # make this check argue with anyone deleting code.
      #
      # The manifest is parsed, never grepped, for the reason the entitlement check above
      # records: the comments in that file name the very categories it declares, so a grep
      # would pass while lying.
      - name: Required reason APIs are declared
        run: |
          set -e
          python3 - <<'PY'
          import json, re, subprocess, sys

          # Apple's categories, and the APIs each covers, from the published list at
          # developer.apple.com/documentation/bundleresources/describing-use-of-required-reason-api
          CATEGORIES = {
              "NSPrivacyAccessedAPICategoryFileTimestamp": r"""
                  attributesOfItem|attributesOfFileSystem|\.modificationDate|\.creationDate
                  |contentModificationDateKey|creationDateKey|NSFileModificationDate
                  |NSFileCreationDate|getattrlist|fgetattrlist|getattrlistbulk
                  |[^a-zA-Z](f|l)?stat\(""",
              "NSPrivacyAccessedAPICategorySystemBootTime":
                  r"systemUptime|mach_absolute_time|mach_continuous_time",
              "NSPrivacyAccessedAPICategoryDiskSpace": r"""
                  volumeAvailableCapacity|systemFreeSize|NSFileSystemFreeSize
                  |volumeTotalCapacity|systemSize""",
              "NSPrivacyAccessedAPICategoryActiveKeyboards":
                  r"activeInputModes|UITextInputMode",
              "NSPrivacyAccessedAPICategoryUserDefaults":
                  r"UserDefaults|@AppStorage",
          }

          # plistlib rather than plutil, for the reason the two steps above record: this job
          # runs on Linux and plutil is macOS only.
          import plistlib
          with open("OpenFactor/PrivacyInfo.xcprivacy", "rb") as handle:
              manifest = plistlib.load(handle)
          declared = {e["NSPrivacyAccessedAPIType"]
                      for e in manifest.get("NSPrivacyAccessedAPITypes", [])}
          print("declared:", " ".join(sorted(declared)) or "(none)")

          # Split on newlines, never on whitespace: "OpenFactorWatch Watch App" is a real
          # directory here, and the first version of this check tore it in half.
          sources = [f for f in subprocess.check_output(
              ["git", "ls-files", "*.swift"], text=True).splitlines()
              if f and "Tests" not in f]

          failed = False
          for category, pattern in CATEGORIES.items():
              expr = re.compile(re.sub(r"\s+", "", pattern))
              hits = []
              for path in sources:
                  with open(path, encoding="utf-8") as handle:
                      for number, line in enumerate(handle, 1):
                          if expr.search(line):
                              hits.append(f"{path}:{number}")
              if hits and category not in declared:
                  failed = True
                  print(f"\nUNDECLARED: {category}")
                  for hit in hits[:10]:
                      print(f"  {hit}")
                  print("  Add it to OpenFactor/PrivacyInfo.xcprivacy with an approved")
                  print("  reason code, checked against Apple's current list rather than")
                  print("  a summary of it. A wrong reason is worse than none: it reads")
                  print("  as though somebody considered the question.")
              elif hits:
                  print(f"ok: {category}, {len(hits)} use(s), declared")

          sys.exit(1 if failed else 0)
          PY

  binary:
    name: No network in the binary
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # **This is the claim the README leads with, checked against the artifact rather than
      # against the source.** The Style job greps our Swift, which is most of the story here
      # because there are no third-party dependencies, but it is a statement about what we
      # wrote. This is a statement about what ships, and it is the one an auditor can repeat.
      #
      # The two checks overlap on purpose and cover each other's blind spot. Proving this one
      # against a broken build found the blind spot the hard way: a URLSession call that
      # nothing reached was dead-stripped by the Release link, and this check passed, rightly,
      # since code that does not ship cannot phone home. The source grep sees dead code; this
      # sees what ships. Neither alone says what both together do.
      #
      # Release rather than Debug, because Release is what ships and Debug carries extra
      # dylibs that are not in it. Simulator rather than device, because the check needs no
      # signing and CI holds no distribution certificate.
      - name: Build Release, unsigned
        run: |
          set -e
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          [ -n "$NAME" ] || { echo "No iPhone simulator on this runner."; exit 1; }
          xcodebuild build -project OpenFactor.xcodeproj -scheme OpenFactor \
            -configuration Release -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath build/rel CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { tail -40 build.log; exit 1; }

      # **A second party's record of what a public commit compiles to.** This runner is not our
      # machine and its log is public and dated, so anybody who builds the same commit for a
      # simulator can compare against these without trusting us or installing anything.
      #
      # **These are simulator values and they are not the shipped hashes.** The job above builds
      # for the simulator because it needs no signing and this runner holds no certificate, so
      # the architecture and the target differ from the device binaries recorded in
      # docs/releases/. **Do not compare the two.** An unsigned device build was tried and did
      # not produce a bundle, so this is the honest ceiling for what CI can publish.
      #
      # **Printed, never asserted.** These change with every source change, which is the point.
      # A check comparing them to a stored value would be red on every commit and would be
      # deleted within a week. See docs/BUILD_PROVENANCE.md and VERIFYING.md.
      - name: Canonical hashes of the compiled code
        run: |
          set -e
          APP=$(find build/rel/Build/Products -name "OpenFactor.app" -maxdepth 3 | head -1)
          [ -n "$APP" ] || { echo "No built app to hash."; exit 1; }
          for binary in \
            "OpenFactor" \
            "PlugIns/OpenFactorShare.appex/OpenFactorShare" \
            "Watch/OpenFactorWatch.app/OpenFactorWatch" \
            "Watch/OpenFactorWatch.app/PlugIns/OpenFactorComplication.appex/OpenFactorComplication"
          do
            if [ -f "$APP/$binary" ]; then
              ./scripts/canonical-hash.sh "$APP/$binary"
            else
              echo "# absent from this build: $binary"
            fi
          done

      - name: Nothing in the bundle can reach the network
        run: |
          set -e
          APP=build/rel/Build/Products/Release-iphonesimulator/OpenFactor.app
          [ -d "$APP" ] || { echo "No app at $APP."; exit 1; }

          # Every Mach-O that ships, found rather than listed: the app, the share extension,
          # the watch app and the complication today, and whatever is added tomorrow. A check
          # naming its targets is a check that goes stale, which this file already learned
          # once from the Swift file sweep above.
          BINARIES=$(find "$APP" -type f -perm +111 \
            ! -path "*_CodeSignature*" ! -name "*.plist" ! -name "*.png" ! -name "*.car")
          [ -n "$BINARIES" ] || { echo "Found no binaries to check. That is a bug in this check."; exit 1; }
          echo "Checking:"; echo "$BINARIES" | sed "s|$APP|  .|"

          # Linked frameworks. Necessary but nowhere near sufficient on its own: URLSession
          # lives in Foundation, which every app links, so the absence of CFNetwork proves
          # much less than it appears to. The symbols below are the real check.
          FRAMEWORKS='CFNetwork|/Network\.framework|NetworkExtension'

          # Exact symbol names, anchored, and **the ObjC shapes were measured rather than
          # guessed**. Swift's URLSession reaches the binary as an ObjC class reference,
          # _OBJC_CLASS_$_NSURLSession, which the first draft of this pattern missed: it was
          # proved against a deliberately broken build that called URLSession, passed while
          # lying, and was rewritten from what nm actually printed. The BSD names are pinned
          # whole because "connect" and "bind" appear inside plenty of innocent identifiers.
          SYMBOLS='OBJC_CLASS_\$_NSURL(Session|Connection)'
          SYMBOLS="$SYMBOLS"'|\$_NSNetService|\$_NSStream'
          SYMBOLS="$SYMBOLS"'|^_+(NS)?URLSession|^_+NSURLConnection'
          SYMBOLS="$SYMBOLS"'|^_+CF(ReadStreamCreate|WriteStreamCreate|Host|NetService|Socket|URLRequest|URLConnection|HTTPMessage)'
          SYMBOLS="$SYMBOLS"'|^_+nw_(connection|endpoint|listener|browser|path_monitor|parameters)'
          SYMBOLS="$SYMBOLS"'|^_(socket|connect|bind|listen|accept|sendto|recvfrom|getaddrinfo|gethostbyname|res_query)$'
          SYMBOLS="$SYMBOLS"'|^_+SSL(CreateContext|Handshake|Write|Read)'
          SYMBOLS="$SYMBOLS"'|swift_FoundationNetworking'

          FAILED=0
          for B in $BINARIES; do
            SHORT=$(echo "$B" | sed "s|$APP|.|")

            if otool -L "$B" | tail -n +2 | grep -qE "$FRAMEWORKS"; then
              echo "FAIL: $SHORT links a networking framework:"
              otool -L "$B" | tail -n +2 | grep -E "$FRAMEWORKS"
              FAILED=1
            fi

            HITS=$(nm -u "$B" 2>/dev/null | sed 's/^ *//' | grep -E "$SYMBOLS" | sort -u || true)
            if [ -n "$HITS" ]; then
              echo "FAIL: $SHORT references networking symbols:"
              echo "$HITS" | sed 's/^/    /'
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "The README says this app makes no network requests of its own, and SECURITY.md"
            echo "explains that iCloud Keychain traffic is the operating system's rather than"
            echo "this app's. Something here now contradicts that. Either it is a mistake, or"
            echo "both documents need changing before this check does."
            exit 1
          fi
          echo "No networking framework linked and no networking symbol referenced."

  package:
    name: Package tests
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # Includes the RFC 4648, RFC 4226, and RFC 6238 vector tables, and the fuzzing.
      # A failure here means the generated codes would be wrong, so this job is never to
      # be skipped or made advisory.
      #
      # The Keychain tests skip in this job. An unsigned test bundle has no entitlement
      # for the data protection Keychain, which is the entire reason the hosted job below
      # exists. Do not "fix" the skip by weakening what those tests assert.
      - name: Test
        run: swift test

  hosted:
    name: Hosted tests, real Keychain
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # Runner images change which simulators they ship, so the device is resolved rather
      # than named. A hardcoded name is the usual reason a job like this rots.
      - name: Pick a simulator
        id: simulator
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator available on this runner."
            exit 1
          fi
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Only the unit tests. The UI test target is a template placeholder with nothing in
      # it worth running, and booting the app for it would add a minute for no signal.
      - name: Test
        run: |
          xcodebuild test \
            -project OpenFactor.xcodeproj \
            -scheme OpenFactor \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -only-testing:OpenFactorTests
