name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project style forbids em dashes everywhere, including code, comments,
      # documentation, and commit messages. The character is written here as an escape
      # so that this file does not fail its own check.
      - name: No em dashes
        run: |
          DASH=$(printf '\xe2\x80\x94')
          if git grep -n -I -- "$DASH"; then
            echo "Found an em dash. Use a comma, a colon, parentheses, or two sentences."
            exit 1
          fi
          echo "No em dashes found."

      # SECURITY.md tells people the app makes no network requests and that this is
      # verified rather than asserted. Until gate A2 nothing verified it. The claim is the
      # foundation of the whole "nothing is stored online" pitch, so it is checked on every
      # push rather than re-established by hand at each audit. Gate A2, F16.
      #
      # It sweeps every Swift file and excludes, rather than naming directories. The first
      # version named three, and the project grew three more in the same pull request that
      # wrote it: the shared folder and both watch targets went unchecked while SECURITY.md
      # said the whole tree was covered. A check that has to be updated whenever a folder
      # appears is a check that will be wrong. Gate A2, F19.
      - name: No network code, and no logging of anything
        run: |
          if git grep -n -I -E \
            'URLSession|NSURLConnection|import Network|CFSocket|Foundation\.URL\(string' \
            -- '*.swift' ':!OpenFactorUITests/*' \
            | grep -v 'URL(string: "https://github.com'; then
            echo "Found something that can reach the network. The app makes no requests."
            exit 1
          fi
          if git grep -n -I -E '\bprint\(|NSLog\(|os_log|Logger\(' \
            -- '*.swift' ':!OpenFactorUITests/*'; then
            echo "Found logging. A code or an account name must never reach a log."
            exit 1
          fi
          echo "No network code and no logging found."

      # Added after an App Store Connect API key identifier was committed to this public
      # repository and pushed. Nothing was compromised: an identifier is not the key, and
      # neither the key nor the issuer identifier was ever here. But a project whose premise
      # is being auditable and careful with secrets should not rely on somebody noticing.
      #
      # These match shapes rather than known values, so the check keeps working after a key
      # is rotated and catches a credential nobody has thought of yet.
      #
      # `git grep -E` does **not** support `\b`. The first version of this check used it,
      # matched nothing, and reported success against a file that contained the exact string
      # it was written to catch. Every pattern here was tested against a positive before
      # being trusted, which is the only reason this job is worth having.
      #
      # This file is excluded from its own patterns, since it necessarily contains them.
      - name: No credentials
        run: |
          fail() {
            echo "$1"
            echo "Credentials are read at run time, never committed. See scripts/ship-testflight.sh."
            exit 1
          }

          # An Apple API key identifier is ten upper case alphanumerics, too common a shape
          # to match alone, so it is anchored to the words that accompany one.
          if git grep -n -I -E \
            '(KEY_ID|KEYID|key_id|keyId|apiKey|api_key|API_KEY|ApiKey)[^A-Za-z0-9]{1,4}[A-Z0-9]{10}([^A-Za-z0-9]|$)' \
            -- ':!.github/workflows/ci.yml'; then
            fail "Found something shaped like an API key identifier."
          fi

          # An issuer identifier is a UUID, and none belongs here: the account's is read from
          # the home directory and test UUIDs are generated at run time.
          if git grep -n -I -E \
            '(issuer|ISSUER|apiIssuer|issuer_id)[^A-Za-z0-9]{1,4}[0-9a-f]{8}-[0-9a-f]{4}' \
            -- ':!.github/workflows/ci.yml'; then
            fail "Found something shaped like an issuer identifier."
          fi

          if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' \
            -- ':!.github/workflows/ci.yml'; then
            fail "Found a private key block."
          fi

          # Files that are credentials whatever is inside them.
          if git ls-files | grep -iE '\.(p8|p12|pem|cer|mobileprovision|keystore|jks)$'; then
            fail "Found a credential file tracked in the repository."
          fi

          echo "No credentials found."

      # RTF fixtures are excluded because in RTF a trailing space is not whitespace: it
      # is the delimiter that terminates a control word, so `\u8232 ` at the end of a line
      # carries meaning. The fixtures are captured exports and are kept byte exact.
      - name: No trailing whitespace
        run: |
          if git grep -n -I -- ' $' -- ':!*.rtf'; then
            echo "Found trailing whitespace."
            exit 1
          fi
          echo "No trailing whitespace found."

      # An Xcode project file is not readable in a diff, so the settings that matter are
      # asserted here instead. Changing one of these is a deliberate act that also has to
      # change this job and docs/PROJECT.md. See that file for what each one is for.
      - name: Project settings are what the documentation says
        run: |
          set -e
          check() {
            if ! grep -q "$1" OpenFactor.xcodeproj/project.pbxproj; then
              echo "Missing from the project file: $1"
              echo "If this change is intended, update this job and docs/PROJECT.md."
              exit 1
            fi
            echo "ok: $1"
          }
          check "PRODUCT_BUNDLE_IDENTIFIER = dev.openfactor.app;"
          # The watch app has to be EMBEDDED in the iOS app, not merely a sibling target
          # in the same project. It was a sibling for three pull requests, which is
          # invisible everywhere that matters: it builds, it installs from Xcode onto a
          # paired watch, and every test passes. The first thing that noticed was
          # TestFlight, which reported "Apple Watch: No" on a build that had already gone
          # to a tester. A phase in a file nobody reads is exactly what this job is for.
          check "Embed Watch Content"
          check "dstSubfolderSpec = 16;"
          check "IPHONEOS_DEPLOYMENT_TARGET = 18.0;"
          check "TEST_HOST = "
          check "relativePath = .;"
          # A missing usage string is not a warning, it is a crash the first time the app
          # touches the camera, and only on a real device.
          check "INFOPLIST_KEY_NSCameraUsageDescription"
          # Same failure shape as the camera string: absent, the Face ID prompt is a
          # crash, not a warning, and only on a real device.
          check "INFOPLIST_KEY_NSFaceIDUsageDescription"
          # The watch app sees the phone's accounts only because both targets declare the
          # same access group. Get this wrong and the watch runs perfectly and shows
          # nothing, which is the hardest kind of bug to attribute.
          check "PRODUCT_BUNDLE_IDENTIFIER = dev.openfactor.app.watchkitapp;"
          check "INFOPLIST_KEY_WKCompanionAppBundleIdentifier = dev.openfactor.app;"
          check "OpenFactorWatch.entitlements"
          check "WATCHOS_DEPLOYMENT_TARGET = 11.0;"
          # The share extension has to be embedded too, and for the same reason the watch
          # app did: a sibling target builds, passes, and reaches nobody.
          check "PRODUCT_BUNDLE_IDENTIFIER = dev.openfactor.app.share;"
          check "Embed Foundation Extensions"
          check "dstSubfolderSpec = 13;"

      # The share extension's security claim is what it CANNOT do, and the absence of an
      # entitlement is the whole of it. An absence is invisible in review and costs one
      # line to reintroduce, so it is asserted here instead of promised in a comment.
      #
      # Structurally, not by grep. The first version of this check counted occurrences of
      # the string in the file and passed while lying, because the comment in that file
      # explains why the key is absent and therefore contains it.
      - name: The share extension cannot reach the Keychain
        run: |
          set -e
          keys=$(plutil -convert json -o - OpenFactorShare/OpenFactorShare.entitlements \
            | python3 -c 'import json,sys; print(" ".join(sorted(json.load(sys.stdin))))')
          echo "entitlement keys: $keys"
          if [ "$keys" != "com.apple.security.application-groups" ]; then
            echo "The share extension must declare the app group and nothing else."
            echo "It must never gain keychain-access-groups: it cannot be allowed to read"
            echo "an account or write one. See OpenFactorShare/ShareViewController.swift."
            exit 1
          fi
          echo "ok: one entitlement, and it is not the Keychain"

      # A required reason API used without a matching manifest entry is invisible: it
      # builds, it runs, it passes every test, and it surfaces as an automated notice from
      # Apple at upload, which is the worst moment to discover it. It is also a rot that
      # arrives by addition rather than by edit. The file timestamp entry was missing from
      # the day SharedInbox gained its freshness window, and nothing anywhere noticed.
      #
      # Only one direction is checked, used but not declared. A declared category that is
      # no longer used is untidy rather than a submission problem, and failing on it would
      # make this check argue with anyone deleting code.
      #
      # The manifest is parsed, never grepped, for the reason the entitlement check above
      # records: the comments in that file name the very categories it declares, so a grep
      # would pass while lying.
      - name: Required reason APIs are declared
        run: |
          set -e
          python3 - <<'PY'
          import json, re, subprocess, sys

          # Apple's categories, and the APIs each covers, from the published list at
          # developer.apple.com/documentation/bundleresources/describing-use-of-required-reason-api
          CATEGORIES = {
              "NSPrivacyAccessedAPICategoryFileTimestamp": r"""
                  attributesOfItem|attributesOfFileSystem|\.modificationDate|\.creationDate
                  |contentModificationDateKey|creationDateKey|NSFileModificationDate
                  |NSFileCreationDate|getattrlist|fgetattrlist|getattrlistbulk
                  |[^a-zA-Z](f|l)?stat\(""",
              "NSPrivacyAccessedAPICategorySystemBootTime":
                  r"systemUptime|mach_absolute_time|mach_continuous_time",
              "NSPrivacyAccessedAPICategoryDiskSpace": r"""
                  volumeAvailableCapacity|systemFreeSize|NSFileSystemFreeSize
                  |volumeTotalCapacity|systemSize""",
              "NSPrivacyAccessedAPICategoryActiveKeyboards":
                  r"activeInputModes|UITextInputMode",
              "NSPrivacyAccessedAPICategoryUserDefaults":
                  r"UserDefaults|@AppStorage",
          }

          manifest = json.loads(subprocess.check_output(
              ["plutil", "-convert", "json", "-o", "-", "OpenFactor/PrivacyInfo.xcprivacy"]))
          declared = {e["NSPrivacyAccessedAPIType"]
                      for e in manifest.get("NSPrivacyAccessedAPITypes", [])}
          print("declared:", " ".join(sorted(declared)) or "(none)")

          # Split on newlines, never on whitespace: "OpenFactorWatch Watch App" is a real
          # directory here, and the first version of this check tore it in half.
          sources = [f for f in subprocess.check_output(
              ["git", "ls-files", "*.swift"], text=True).splitlines()
              if f and "Tests" not in f]

          failed = False
          for category, pattern in CATEGORIES.items():
              expr = re.compile(re.sub(r"\s+", "", pattern))
              hits = []
              for path in sources:
                  with open(path, encoding="utf-8") as handle:
                      for number, line in enumerate(handle, 1):
                          if expr.search(line):
                              hits.append(f"{path}:{number}")
              if hits and category not in declared:
                  failed = True
                  print(f"\nUNDECLARED: {category}")
                  for hit in hits[:10]:
                      print(f"  {hit}")
                  print("  Add it to OpenFactor/PrivacyInfo.xcprivacy with an approved")
                  print("  reason code, checked against Apple's current list rather than")
                  print("  a summary of it. A wrong reason is worse than none: it reads")
                  print("  as though somebody considered the question.")
              elif hits:
                  print(f"ok: {category}, {len(hits)} use(s), declared")

          sys.exit(1 if failed else 0)
          PY

  package:
    name: Package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # Includes the RFC 4648, RFC 4226, and RFC 6238 vector tables, and the fuzzing.
      # A failure here means the generated codes would be wrong, so this job is never to
      # be skipped or made advisory.
      #
      # The Keychain tests skip in this job. An unsigned test bundle has no entitlement
      # for the data protection Keychain, which is the entire reason the hosted job below
      # exists. Do not "fix" the skip by weakening what those tests assert.
      - name: Test
        run: swift test

  hosted:
    name: Hosted tests, real Keychain
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -switch "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # Runner images change which simulators they ship, so the device is resolved rather
      # than named. A hardcoded name is the usual reason a job like this rots.
      - name: Pick a simulator
        id: simulator
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator available on this runner."
            exit 1
          fi
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Only the unit tests. The UI test target is a template placeholder with nothing in
      # it worth running, and booting the app for it would add a minute for no signal.
      - name: Test
        run: |
          xcodebuild test \
            -project OpenFactor.xcodeproj \
            -scheme OpenFactor \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -only-testing:OpenFactorTests
