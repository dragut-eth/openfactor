<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B21"/>
      <stop offset="1" stop-color="#08080B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="1.0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#EF5F55"/><stop offset="1" stop-color="#A31D1D"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F07A32"/><stop offset="1" stop-color="#A03E0C"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4BB35A"/><stop offset="1" stop-color="#1D6F2B"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#21AFA3"/><stop offset="1" stop-color="#075E58"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6A6AE8"/><stop offset="1" stop-color="#33339B"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E94A86"/><stop offset="1" stop-color="#991245"/>
    </linearGradient>
  </defs>

  <!-- Charcoal-to-black gradient canvas, lit from upper left; iOS applies the corner mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Six digits, six accounts, all gradients falling with the same light -->
  <rect x="176" y="298" width="184" height="184" rx="52" fill="url(#red)"/>
  <rect x="420" y="298" width="184" height="184" rx="52" fill="url(#orange)"/>
  <rect x="664" y="298" width="184" height="184" rx="52" fill="url(#green)"/>
  <rect x="176" y="542" width="184" height="184" rx="52" fill="url(#teal)"/>
  <rect x="420" y="542" width="184" height="184" rx="52" fill="url(#indigo)"/>
  <rect x="664" y="542" width="184" height="184" rx="52" fill="url(#pink)"/>
</svg>
