<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B21"/>
      <stop offset="1" stop-color="#08080B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="1.0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#EF5F55"/><stop offset="1" stop-color="#A31D1D"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F07A32"/><stop offset="1" stop-color="#A03E0C"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4BB35A"/><stop offset="1" stop-color="#1D6F2B"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#21AFA3"/><stop offset="1" stop-color="#075E58"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6A6AE8"/><stop offset="1" stop-color="#33339B"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E94A86"/><stop offset="1" stop-color="#991245"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Scrambled cube, 2x2 facets per face, six colors twice each.
       Apex (512,96), center vertex (512,512), bottom (512,928). -->

  <!-- Top face -->
  <polygon points="512,96 685.9,196.5 512,296.9 338.1,196.5" fill="url(#orange)"/>
  <polygon points="698.1,203.5 872,304 698.1,404.5 524.2,304" fill="url(#green)"/>
  <polygon points="325.9,203.5 499.8,304 325.9,404.5 152,304" fill="url(#red)"/>
  <polygon points="512,311.1 685.9,411.5 512,512 338.1,411.5" fill="url(#indigo)"/>

  <!-- Right face -->
  <polygon points="872,304 698.1,404.5 698.1,605.3 872,504.8" fill="url(#pink)"/>
  <polygon points="685.9,411.5 512,512 512,712.8 685.9,612.3" fill="url(#teal)"/>
  <polygon points="872,519 698.1,619.5 698.1,820.3 872,720" fill="url(#indigo)"/>
  <polygon points="685.9,626.5 512,727 512,928 685.9,827.3" fill="url(#green)"/>

  <!-- Left face -->
  <polygon points="152,304 325.9,404.5 325.9,605.3 152,504.8" fill="url(#pink)"/>
  <polygon points="338.1,411.5 512,512 512,712.8 338.1,612.3" fill="url(#orange)"/>
  <polygon points="152,519 325.9,619.5 325.9,820.3 152,720" fill="url(#teal)"/>
  <polygon points="338.1,626.5 512,727 512,928 338.1,827.3" fill="url(#red)"/>

  <!-- One light, upper left -->
  <polygon points="152,304 512,512 512,928 152,720" fill="#000000" opacity="0.08"/>
  <polygon points="872,304 872,720 512,928 512,512" fill="#000000" opacity="0.20"/>
</svg>
